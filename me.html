<!DOCTYPE html>

<head>

  <style>
    :root {
      --bg: #1c2026;
      --card: #232932;
      --card-deep: #1f252d;
      --text: #f3f6fa;
      --muted: #aeb8c5;
      --line: rgba(255,255,255,0.10);
      --accent: #2e78ff;
      --accent-hover: #1f66ea;
      --icon: #d2d6dc;
      --role: #8ea6c9;
      --link: #d7dde6;
      --link-hover: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(46,120,255,0.10), transparent 30%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, var(--card) 0%, var(--card-deep) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 24px;
      box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        0 1px 0 rgba(255,255,255,.04) inset;
      animation: cardFadeUp 620ms cubic-bezier(.22,1,.36,1) both;
      will-change: transform, opacity;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      line-height: 1.1;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .role {
      margin: 0 0 20px;
      color: var(--role);
      font-size: 15px;
      line-height: 1.4;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 15px;
      line-height: 1.45;
    }

    .icon {
      width: 22px;
      min-width: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    a {
      color: var(--link);
      text-decoration: none;
      transition: color 180ms ease;
      word-break: break-word;
    }

    a:hover {
      color: var(--link-hover);
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px 16px;
      border-radius: 12px;
      margin-top: 12px;
      text-decoration: none;
      font-weight: 600;
      line-height: 1.2;
      transition:
        background-color 180ms ease,
        border-color 180ms ease,
        color 180ms ease,
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 10px 24px rgba(46,120,255,.22);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      color: var(--icon);
    }

    .small {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.45;
      color: #9aa3ad;
      text-align: center;
    }

    @keyframes cardFadeUp {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 20px;
        border-radius: 18px;
      }

      h1 {
        font-size: 24px;
      }

      .role,
      .item {
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .btn,
      a {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
